services:
  my-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-portfolio
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3102:3000"
    volumes:
      - chat-data:/app/data
      # Binaire claude natif (hote) + comptes deja connectes, jamais reinstalles/relogges ici,
      # meme patron que my-agents/Elon (canal Telegram) et my-agents/Nate.
      - /root/.local:/root/.local:ro
      - /root/.claude:/claude-accounts/nathan/.claude
      - /root/.claude.json:/claude-accounts/nathan/.claude.json
      - /root/.claude-accounts/admin-mdd:/claude-accounts/admin-mdd
      - /root/.claude-accounts/ben-mdd:/claude-accounts/ben-mdd
      # Dossier nate (mission.md, data/plans/) : meme agent, meme etat que le canal Telegram.
      - /data/nathan/my-agents/Nate:/data/nathan/my-agents/Nate
      # Regles d etancheite partagees par tout le parc (lecture seule) : Nate est
      # le seul canal public, il ne doit pas tourner sans elles.
      - /data/nathan/my-agents/shared:/data/nathan/my-agents/shared:ro
    # 2 Go minimum depuis le 19/08/2026 (regle de parc) : ce conteneur porte
    # le chat web de Nate, qui lance des process claude. Un agent Claude lance
    # des sous-process par conception (bascule de compte, mesure de pression,
    # delegation). A moins de 2 Go le conteneur est tue par le noyau et l'echec
    # remonte en "claude a termine avec le code null" - illisible. Incident reel
    # sur Luffy ce jour-la.
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chat-data:
